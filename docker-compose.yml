services:
  node:
    build:
      context: ./
      args:
        UID: 1000
        GID: 1000
    image: wmde/query-builder
    volumes:
      - "~/.npm:/.npm"
      - "./:/app"
    working_dir: /app
    environment:
      # Ensures cypress installs and looks for it's binary in a project local directory
      - CYPRESS_CACHE_FOLDER=./.cache/cypress
    user: "1000:1000"

  dev:
    extends:
      service: node
    command: npm run serve
    ports:
      - "${PORT}:${PORT}"
    environment:
      - NODE_ENV=development