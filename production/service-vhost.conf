<VirtualHost *:8080>

    ServerName query.wikidata.org
    ServerAlias commons-query.wikimedia.org query-main.wikidata.org query-scholarly.wikidata.org
    ServerAdmin sre-collaboration-services@wikimedia.org
    DocumentRoot /srv/app/html/

    ErrorLog /dev/stderr
    LogLevel warn

    # Rewrite not-found top-level assets into the per-site docroot to
    # support per-site favicon/etc. Only rewrites when the target file
    # exists, otherwise this would also capture aliases such as /querybuilder.
    RewriteEngine On
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}/sites/wcqs/%{REQUEST_URI} -f
    RewriteRule ^/([^/]+)$ %{DOCUMENT_ROOT}/sites/wcqs/$1

    <Directory />
        Options FollowSymLinks
        AllowOverride None
    </Directory>

    <Directory /srv/app/html>
        Header set Cache-Control "max-age=3600, must-revalidate"
        Options FollowSymLinks MultiViews
        AllowOverride None
        Require all granted

        <FilesMatch "^(index|embed)\.html$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </Directory>

    Alias /querybuilder    "/srv/app/html/querybuilder"
    <Directory /srv/org/wikidata/query-builder>
        Header set Cache-Control "max-age=3600, must-revalidate"
        Header set X-Xss-Protection "1; mode=block"
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set Content-Security-Policy "default-src 'self'; child-src 'self' blob:; connect-src 'self' https://www.wikidata.org https://meta.wikimedia.org; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
        Options FollowSymLinks MultiViews
        AllowOverride None
        Require all granted

        <Files "index.html">
            Header set Cache-Control "no-cache"
        </Files>
    </Directory>


    <Directory /srv/app/html/.git>
        Require all denied
    </Directory>

</VirtualHost>
